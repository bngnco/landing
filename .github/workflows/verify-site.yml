name: Verify site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build + verify-site + claims lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, verify the site and lint public claims
        # npm test = build-deploy + verify-site + check:claims (scripts/verify-claims.mjs).
        run: npm test
